# The lookback window prior to visit date for each feature category. Records taken within this time window are valid.
trt_lookback_window: [-28, -1] # days
lab_lookback_window: [-30, -1] # days
symp_lookback_window: [-30, -1] # days
ed_visit_lookback_window: 5 # years
trt_lookahead_window: 5 # days

# Heuristic fill values for missing data
# days_since_prev_ED_visit is derived for both anchors as ed_visit_lookback_window * 365
fill_missing_data:
  treatment:
    days_since_last_treatment: 4746
  clinic:
    days_since_last_treatment: 28
